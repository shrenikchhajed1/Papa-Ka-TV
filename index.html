<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Ka TV - पापा का टीवी</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HOME SCREEN ===== */
        #home-screen {
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #home-screen h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #e94560;
            text-align: center;
        }

        #home-screen .subtitle {
            font-size: 22px;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
        }

        .section-title {
            font-size: 28px;
            color: #e94560;
            margin: 30px 0 16px 0;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            border-top: 2px solid #333;
            padding-top: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .grid-btn {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 3px solid #e94560;
            border-radius: 16px;
            padding: 24px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }

        .grid-btn:hover {
            background: linear-gradient(135deg, #e94560, #c0392b);
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.4);
        }

        .grid-btn:active {
            transform: scale(0.97);
        }

        .grid-btn .hindi-name {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 4px;
        }

        .grid-btn .eng-name {
            font-size: 16px;
            color: #ccc;
            display: block;
        }

        /* LIVE / RECORDED badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 8px;
            padding: 2px 10px;
            border-radius: 8px;
        }
        .live-badge.is-live {
            color: #fff;
            background: rgba(231, 76, 60, 0.35);
        }
        .live-badge.is-live .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .live-badge.not-live {
            color: #999;
            background: rgba(255,255,255,0.08);
        }
        /* Smaller badge for bottom strip buttons */
        .strip-live-badge {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-left: 6px;
            padding: 1px 5px;
            border-radius: 4px;
            vertical-align: middle;
        }
        .strip-live-badge.is-live {
            color: #fff;
            background: rgba(231, 76, 60, 0.5);
        }
        .strip-live-badge.not-live {
            color: #888;
            background: rgba(255,255,255,0.1);
        }
        /* Now-playing LIVE indicator */
        .now-playing-live {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-left: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            vertical-align: middle;
        }
        .now-playing-live.is-live {
            color: #fff;
            background: #e74c3c;
        }
        .now-playing-live.not-live {
            color: #999;
            background: rgba(255,255,255,0.1);
        }

        /* Songs button on home - bigger and distinct */
        .songs-nav-btn {
            background: linear-gradient(135deg, #0f3460, #533483);
            border: 3px solid #e94560;
            border-radius: 20px;
            padding: 32px 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .songs-nav-btn:hover {
            background: linear-gradient(135deg, #533483, #e94560);
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.4);
        }

        .songs-nav-btn:active {
            transform: scale(0.97);
        }

        .songs-nav-btn .hindi-name {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 6px;
        }

        .songs-nav-btn .eng-name {
            font-size: 20px;
            color: #ccc;
            display: block;
        }

        /* ===== ARTIST GRID SCREEN ===== */
        #artist-screen {
            display: none;
            padding: 30px 40px;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #artist-screen h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #e94560;
            text-align: center;
        }

        #artist-screen .subtitle {
            font-size: 22px;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
        }

        .back-home-btn {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            margin-bottom: 24px;
        }

        .back-home-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .back-home-btn:active {
            transform: scale(0.95);
        }

        /* ===== PLAYER SCREEN ===== */
        #player-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #0a0a1a;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #16213e;
            border-bottom: 3px solid #e94560;
        }

        .now-playing {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-left: 16px;
        }

        .back-btn {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .player-area {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Volume control - left side */
        .volume-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: #16213e;
            width: 80px;
            gap: 10px;
            border-right: 2px solid #333;
        }

        .vol-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid #e94560;
            background: #0f3460;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            user-select: none;
            line-height: 1;
        }

        .vol-btn:hover {
            background: #e94560;
            transform: scale(1.1);
        }

        .vol-btn:active {
            transform: scale(0.9);
        }

        .volume-slider-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 100px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            outline: none;
            transform: rotate(-90deg);
            transform-origin: center center;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: 3px solid #fff;
        }

        .volume-slider::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: 3px solid #fff;
        }

        .vol-value {
            font-size: 18px;
            color: #e94560;
            font-weight: bold;
        }

        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            min-height: 0;
            position: relative;
        }

        #yt-player {
            width: 100%;
            height: 100%;
        }

        .video-message {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        .video-message .msg-text {
            font-size: 22px;
            color: #ccc;
        }

        .video-message .open-link {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .video-message .open-link:hover {
            background: #c0392b;
        }

        /* Artist strip - horizontal scrollable row below top bar */
        .artist-strip {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: #1a1a3e;
            border-bottom: 2px solid #533483;
            overflow-x: auto;
            align-items: center;
        }

        .artist-strip-btn {
            flex-shrink: 0;
            background: #0f3460;
            border: 2px solid #533483;
            border-radius: 10px;
            padding: 8px 18px;
            color: #ccc;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            white-space: nowrap;
        }

        .artist-strip-btn:hover {
            border-color: #e94560;
            color: #fff;
            background: #1a2a5e;
        }

        .artist-strip-btn.active {
            background: #533483;
            border-color: #e94560;
            color: #fff;
        }

        /* Right-side song list panel */
        .song-panel {
            width: 300px;
            min-width: 300px;
            background: #12122a;
            border-left: 2px solid #333;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .song-panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #e94560;
            padding: 10px 14px;
            border-bottom: 1px solid #333;
            background: #16213e;
            text-align: center;
        }

        .song-panel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid #1a1a3e;
            user-select: none;
        }

        .song-panel-item:hover {
            background: #1a2a5e;
        }

        .song-panel-item.active {
            background: #e94560;
        }

        .song-panel-item .sp-num {
            font-size: 14px;
            font-weight: bold;
            color: #e94560;
            min-width: 26px;
            text-align: center;
        }

        .song-panel-item.active .sp-num {
            color: #fff;
        }

        .song-panel-item .sp-name {
            font-size: 14px;
            color: #ccc;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-panel-item.active .sp-name {
            color: #fff;
            font-weight: bold;
        }

        .song-panel-item .sp-hindi {
            display: block;
            font-size: 15px;
            color: #fff;
        }

        .song-panel-item .sp-eng {
            display: block;
            font-size: 12px;
            color: #aaa;
        }

        .song-panel-item.active .sp-eng {
            color: #ddd;
        }

        /* Bottom strip (always news channels) */
        .bottom-strip {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #16213e;
            border-top: 2px solid #333;
            overflow-x: auto;
            align-items: center;
        }

        .strip-btn {
            flex-shrink: 0;
            background: #0f3460;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 10px 20px;
            color: #ccc;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            white-space: nowrap;
        }

        .strip-btn:hover {
            border-color: #e94560;
            color: #fff;
        }

        .strip-btn.active {
            background: #e94560;
            border-color: #e94560;
            color: #fff;
        }

        .mute-btn {
            width: 56px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: #0f3460;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            user-select: none;
        }

        .mute-btn:hover {
            background: #e94560;
        }

        .mute-btn.muted {
            background: #c0392b;
            border-color: #c0392b;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== PAGINATION (for artist grid) ===== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        .page-btn {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .page-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .page-btn:active {
            transform: scale(0.95);
        }

        .page-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .page-info {
            font-size: 20px;
            color: #aaa;
            min-width: 120px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ===== HOME SCREEN ===== -->
    <div id="home-screen">
        <h1>पापा का टीवी</h1>
        <div class="subtitle">Papa Ka TV - समाचार और गाने / News & Songs</div>

        <!-- News Channels -->
        <div class="section-title">समाचार चैनल / News Channels</div>
        <div class="grid" id="news-grid"></div>

        <!-- Songs Button -->
        <div class="songs-nav-btn" onclick="showArtistScreen()">
            <span class="hindi-name">&#x266B; गाने सुनें &#x266B;</span>
            <span class="eng-name">Listen to Songs</span>
        </div>
    </div>

    <!-- ===== ARTIST GRID SCREEN ===== -->
    <div id="artist-screen">
        <button class="back-home-btn" onclick="showHomeScreen()">&#x2190; वापस जाएँ (Back Home)</button>
        <h1>गायक चुनें</h1>
        <div class="subtitle">Choose an Artist</div>
        <div class="grid" id="artist-grid"></div>
        <div class="pagination" id="artist-pagination"></div>
    </div>

    <!-- ===== PLAYER SCREEN ===== -->
    <div id="player-screen">
        <div class="top-bar">
            <button class="back-btn" id="back-btn">&#x2190; वापस (Back)</button>
            <span class="now-playing" id="now-playing-label"></span>
        </div>
        <div class="artist-strip" id="artist-strip"></div>
        <div class="player-area">
            <div class="volume-panel">
                <button class="vol-btn" onclick="volumeUp()" title="Volume Up">+</button>
                <div class="volume-slider-container">
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volume-slider" oninput="onVolumeSlider(this.value)">
                </div>
                <button class="vol-btn" onclick="volumeDown()" title="Volume Down">&minus;</button>
                <button class="mute-btn" id="mute-btn" onclick="toggleMute()">&#x1F50A;</button>
                <span class="vol-value" id="vol-display">70</span>
            </div>
            <div class="video-container" id="video-container">
                <div id="yt-player"></div>
            </div>
            <div class="song-panel" id="song-panel">
                <div class="song-panel-title" id="song-panel-title">गाने (Songs)</div>
                <div id="song-panel-list"></div>
            </div>
        </div>
        <div class="bottom-strip" id="bottom-strip"></div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

        // BUILD HOME SCREEN - NEWS GRID
        // =================================================================
        function buildNewsGrid() {
            const container = document.getElementById('news-grid');
            channels.forEach((ch, index) => {
                const btn = document.createElement('div');
                btn.className = 'grid-btn';
                btn.style.borderColor = ch.color;
                const badgeClass = ch.isLive ? 'is-live' : 'not-live';
                const badgeContent = ch.isLive
                    ? '<span class="live-dot"></span> LIVE'
                    : 'RECORDED';
                btn.innerHTML = `
                    <span class="hindi-name">${ch.hindi}</span>
                    <span class="eng-name">${ch.english}</span>
                    <span class="live-badge ${badgeClass}">${badgeContent}</span>
                `;
                btn.onclick = () => playNews(index);
                container.appendChild(btn);
            });
        }

        // =================================================================
        // BUILD ARTIST GRID (PAGINATED)
        // =================================================================
        function renderArtistPage() {
            const container = document.getElementById('artist-grid');
            container.innerHTML = '';
            const totalPages = Math.ceil(artists.length / ARTISTS_PER_PAGE);
            const start = artistPage * ARTISTS_PER_PAGE;
            const end = Math.min(start + ARTISTS_PER_PAGE, artists.length);

            for (let i = start; i < end; i++) {
                const artist = artists[i];
                const btn = document.createElement('div');
                btn.className = 'grid-btn';
                btn.style.borderColor = artist.color;
                btn.innerHTML = `
                    <span class="hindi-name">${artist.hindi}</span>
                    <span class="eng-name">${artist.english}</span>
                `;
                btn.onclick = () => openArtistInPlayer(i);
                container.appendChild(btn);
            }

            // Pagination controls
            const pag = document.getElementById('artist-pagination');
            pag.innerHTML = '';
            if (totalPages > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'page-btn';
                prevBtn.textContent = '\u2190 \u092A\u093F\u091B\u0932\u093E (Prev)';
                prevBtn.disabled = artistPage === 0;
                prevBtn.onclick = () => { artistPage--; renderArtistPage(); };
                pag.appendChild(prevBtn);

                const info = document.createElement('span');
                info.className = 'page-info';
                info.textContent = `\u092A\u0943\u0937\u094D\u0920 ${artistPage + 1} / ${totalPages}`;
                pag.appendChild(info);

                const nextBtn = document.createElement('button');
                nextBtn.className = 'page-btn';
                nextBtn.textContent = '\u0905\u0917\u0932\u093E (Next) \u2192';
                nextBtn.disabled = artistPage === totalPages - 1;
                nextBtn.onclick = () => { artistPage++; renderArtistPage(); };
                pag.appendChild(nextBtn);
            }
        }

        // =================================================================
        // BUILD BOTTOM STRIP (ALWAYS NEWS CHANNELS)
        // =================================================================
        function buildBottomNewsStrip() {
            const strip = document.getElementById('bottom-strip');
            strip.innerHTML = '';
            channels.forEach((ch, index) => {
                const btn = document.createElement('button');
                btn.className = 'strip-btn';
                const badgeClass = ch.isLive ? 'is-live' : 'not-live';
                const badgeText = ch.isLive ? 'LIVE' : 'REC';
                btn.innerHTML = `${ch.hindi} (${ch.english}) <span class="strip-live-badge ${badgeClass}">${badgeText}</span>`;
                if (playerMode === 'news' && index === currentNewsIndex) btn.classList.add('active');
                btn.onclick = () => playNews(index);
                strip.appendChild(btn);
            });
        }

        // =================================================================
        // BUILD ARTIST STRIP (TOP, SCROLLABLE)
        // =================================================================
        function buildArtistStrip() {
            const strip = document.getElementById('artist-strip');
            strip.innerHTML = '';
            artists.forEach((artist, index) => {
                const btn = document.createElement('button');
                btn.className = 'artist-strip-btn';
                if (index === currentArtistIndex) btn.classList.add('active');
                btn.textContent = `${artist.hindi}`;
                btn.onclick = () => switchArtistInPlayer(index);
                strip.appendChild(btn);
            });
            // Scroll to the active artist
            setTimeout(() => {
                const active = strip.querySelector('.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
        }

        function switchArtistInPlayer(artistIndex) {
            const previousArtist = currentArtistIndex;
            currentArtistIndex = artistIndex;
            // If switching to a different artist, reset song index since nothing from this artist is playing
            if (artistIndex !== previousArtist) {
                currentSongIndex = -1;
            }
            // Switch to songs mode (show song panel) if we were in news mode
            if (playerMode === 'news') {
                playerMode = 'songs';
                currentNewsIndex = null;
                setPlayerMode('songs');
                const artist = artists[artistIndex];
                document.getElementById('now-playing-label').textContent = `${artist.hindi} - ${artist.english} - गाना चुनें (Choose a Song)`;
                document.getElementById('now-playing-label').style.color = artist.color;
                document.getElementById('back-btn').onclick = () => showArtistScreen();
                destroyPlayer();
                showChooseSongMessage();
                buildBottomNewsStrip();
            }
            // Update artist strip highlighting
            const btns = document.querySelectorAll('.artist-strip-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', i === artistIndex);
            });
            // Update song panel
            buildSongPanel();
        }

        // =================================================================
        // BUILD SONG PANEL (RIGHT SIDE)
        // =================================================================
        function buildSongPanel() {
            const artist = artists[currentArtistIndex];
            if (!artist || !artist.songs) return;

            document.getElementById('song-panel-title').textContent = `${artist.hindi} - गाने`;
            const list = document.getElementById('song-panel-list');
            list.innerHTML = '';

            artist.songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'song-panel-item';
                if (index === currentSongIndex && playerMode === 'songs') item.classList.add('active');
                item.innerHTML = `
                    <span class="sp-num">${index + 1}</span>
                    <div>
                        <span class="sp-hindi">${song.hindi}</span>
                        <span class="sp-eng">${song.english}</span>
                    </div>
                `;
                item.onclick = () => playSong(currentArtistIndex, index);
                list.appendChild(item);
            });

            // Scroll to active song
            setTimeout(() => {
                const active = list.querySelector('.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        // Show/hide artist strip and song panel based on mode
        function setPlayerMode(mode) {
            const artistStrip = document.getElementById('artist-strip');
            const songPanel = document.getElementById('song-panel');
            // Artist strip always visible so father can switch from news to songs
            artistStrip.style.display = 'flex';
            if (mode === 'news') {
                songPanel.style.display = 'none';
            } else {
                songPanel.style.display = 'flex';
            }
        }

        // Open artist in player (from artist grid) - shows player with song list, no auto-play
        function openArtistInPlayer(artistIndex) {
            playerMode = 'songs';
            currentArtistIndex = artistIndex;
            currentSongIndex = -1; // no song playing yet
            currentNewsIndex = null;

            const artist = artists[artistIndex];
            document.getElementById('now-playing-label').textContent = `${artist.hindi} - ${artist.english} - गाना चुनें (Choose a Song)`;
            document.getElementById('now-playing-label').style.color = artist.color;
            document.getElementById('back-btn').onclick = () => showArtistScreen();

            showPlayerScreen();
            setPlayerMode('songs');
            buildArtistStrip();
            buildSongPanel();
            buildBottomNewsStrip();
            // Don't auto-play, show a message in the video area
            destroyPlayer();
            showChooseSongMessage();
        }

        // =================================================================
        // OVERLAYS
        // =================================================================
        function showLoading() {
            removeOverlay();
            const container = document.getElementById('video-container');
            const overlay = document.createElement('div');
            overlay.className = 'video-message';
            overlay.id = 'loading-overlay';
            overlay.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="msg-text">लोड हो रहा है... (Loading...)</div>
            `;
            container.appendChild(overlay);
        }

        function showError(fallbackUrl, label) {
            removeOverlay();
            const container = document.getElementById('video-container');
            const overlay = document.createElement('div');
            overlay.className = 'video-message';
            overlay.id = 'error-overlay';
            overlay.innerHTML = `
                <div class="msg-text">यह वीडियो उपलब्ध नहीं है<br>(This video is not available)</div>
                <a class="open-link" href="${fallbackUrl}" target="_blank">
                    YouTube पर देखें (Open on YouTube)
                </a>
            `;
            container.appendChild(overlay);
        }

        function removeOverlay() {
            ['error-overlay', 'loading-overlay', 'choose-overlay'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
        }

        function showChooseSongMessage() {
            removeOverlay();
            const container = document.getElementById('video-container');
            const overlay = document.createElement('div');
            overlay.className = 'video-message';
            overlay.id = 'choose-overlay';
            overlay.innerHTML = `
                <div style="font-size: 60px;">&#x266B;</div>
                <div class="msg-text">दाईं ओर से गाना चुनें<br>(Choose a song from the right panel)</div>
            `;
            container.appendChild(overlay);
        }

        // =================================================================
        // PLAYER MANAGEMENT
        // =================================================================
        function destroyPlayer() {
            if (ytPlayer) {
                try { ytPlayer.destroy(); } catch(e) {}
                ytPlayer = null;
            }
            removeOverlay();
            ensurePlayerDiv();
        }

        function ensurePlayerDiv() {
            const container = document.getElementById('video-container');
            let playerDiv = document.getElementById('yt-player');
            if (!playerDiv) {
                playerDiv = document.createElement('div');
                playerDiv.id = 'yt-player';
                container.insertBefore(playerDiv, container.firstChild);
            }
        }

        function waitForApiThen(callback) {
            if (ytApiReady) {
                callback();
            } else {
                const check = setInterval(() => {
                    if (ytApiReady) {
                        clearInterval(check);
                        callback();
                    }
                }, 200);
            }
        }

        function applyVolume(player) {
            player.setVolume(currentVolume);
            if (isMuted) {
                player.mute();
            } else {
                player.unMute();
            }
        }

        // =================================================================
        // PLAY NEWS CHANNEL
        // =================================================================
        function playNews(index) {
            const ch = channels[index];
            playerMode = 'news';
            currentNewsIndex = index;
            currentArtistIndex = null;

            // UI
            const liveClass = ch.isLive ? 'is-live' : 'not-live';
            const liveText = ch.isLive ? 'LIVE' : 'RECORDED';
            const label = document.getElementById('now-playing-label');
            label.innerHTML = `${ch.hindi} - ${ch.english} <span class="now-playing-live ${liveClass}">${liveText}</span>`;
            label.style.color = ch.color;
            document.getElementById('back-btn').onclick = showHomeScreen;

            showPlayerScreen();
            setPlayerMode('news');
            buildArtistStrip();
            buildBottomNewsStrip();
            destroyPlayer();
            showLoading();

            waitForApiThen(() => {
                ytPlayer = new YT.Player('yt-player', {
                    videoId: ch.videoId,
                    width: '100%',
                    height: '100%',
                    playerVars: {
                        autoplay: 1,
                        rel: 0,
                        modestbranding: 1,
                        iv_load_policy: 3,
                        controls: 1,
                        fs: 1
                    },
                    events: {
                        onReady: function(e) {
                            removeOverlay();
                            applyVolume(e.target);
                        },
                        onError: function() {
                            removeOverlay();
                            showError(`https://www.youtube.com/@${ch.handle}/live`, ch.english);
                        }
                    }
                });
            });
        }

        // =================================================================
        // PLAY INDIVIDUAL SONG
        // =================================================================
        function playSong(artistIndex, songIndex) {
            const artist = artists[artistIndex];
            const song = artist.songs[songIndex];
            playerMode = 'songs';
            currentArtistIndex = artistIndex;
            currentSongIndex = songIndex;
            currentNewsIndex = null;

            // UI
            updateNowPlayingLabel(artist, song);
            document.getElementById('back-btn').onclick = () => showArtistScreen();

            showPlayerScreen();
            setPlayerMode('songs');
            buildArtistStrip();
            buildSongPanel();
            buildBottomNewsStrip();
            destroyPlayer();
            showLoading();

            waitForApiThen(() => {
                ytPlayer = new YT.Player('yt-player', {
                    width: '100%',
                    height: '100%',
                    videoId: song.videoId,
                    playerVars: {
                        autoplay: 1,
                        rel: 0,
                        modestbranding: 1,
                        iv_load_policy: 3,
                        controls: 1,
                        fs: 1
                    },
                    events: {
                        onReady: function(e) {
                            removeOverlay();
                            applyVolume(e.target);
                        },
                        onStateChange: function(e) {
                            // When video ends, play next song
                            if (e.data === YT.PlayerState.ENDED) {
                                const nextIdx = currentSongIndex + 1;
                                if (nextIdx < artist.songs.length) {
                                    playSong(artistIndex, nextIdx);
                                } else {
                                    // Loop back to first song
                                    playSong(artistIndex, 0);
                                }
                            }
                        },
                        onError: function() {
                            removeOverlay();
                            // On error, try next song
                            const nextIdx = currentSongIndex + 1;
                            if (nextIdx < artist.songs.length) {
                                playSong(artistIndex, nextIdx);
                            } else {
                                showError(`https://www.youtube.com/watch?v=${song.videoId}`, song.english);
                            }
                        }
                    }
                });
            });
        }

        function updateNowPlayingLabel(artist, song) {
            const label = document.getElementById('now-playing-label');
            if (song) {
                label.textContent = `${artist.hindi} - ${song.hindi} (${song.english})`;
            } else {
                label.textContent = `${artist.hindi} - ${artist.english}`;
            }
            label.style.color = artist.color;
        }

        // =================================================================
        // VOLUME CONTROLS
        // =================================================================
        function setVolume(vol) {
            currentVolume = Math.max(0, Math.min(100, vol));
            document.getElementById('volume-slider').value = currentVolume;
            document.getElementById('vol-display').textContent = currentVolume;

            if (currentVolume === 0) {
                isMuted = true;
                document.getElementById('mute-btn').classList.add('muted');
                document.getElementById('mute-btn').innerHTML = '&#x1F507;';
            } else {
                isMuted = false;
                document.getElementById('mute-btn').classList.remove('muted');
                document.getElementById('mute-btn').innerHTML = '&#x1F50A;';
            }

            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                ytPlayer.setVolume(currentVolume);
                if (isMuted) ytPlayer.mute();
                else ytPlayer.unMute();
            }
        }

        function volumeUp() { setVolume(currentVolume + 10); }
        function volumeDown() { setVolume(currentVolume - 10); }
        function onVolumeSlider(val) { setVolume(parseInt(val)); }

        function toggleMute() {
            if (isMuted) {
                isMuted = false;
                document.getElementById('mute-btn').classList.remove('muted');
                document.getElementById('mute-btn').innerHTML = '&#x1F50A;';
                if (ytPlayer && typeof ytPlayer.unMute === 'function') {
                    ytPlayer.unMute();
                    ytPlayer.setVolume(currentVolume > 0 ? currentVolume : 50);
                }
                if (currentVolume === 0) setVolume(50);
            } else {
                isMuted = true;
                document.getElementById('mute-btn').classList.add('muted');
                document.getElementById('mute-btn').innerHTML = '&#x1F507;';
                if (ytPlayer && typeof ytPlayer.mute === 'function') {
                    ytPlayer.mute();
                }
            }
        }

        // =================================================================
        // KEYBOARD SHORTCUTS
        // =================================================================
        document.addEventListener('keydown', function(e) {
            const playerVisible = document.getElementById('player-screen').style.display === 'flex';
            const artistVisible = document.getElementById('artist-screen').style.display === 'flex';

            if (playerVisible) {
                switch(e.key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        volumeUp();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        volumeDown();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        if (playerMode === 'news' && currentNewsIndex !== null) {
                            playNews((currentNewsIndex + 1) % channels.length);
                        } else if (playerMode === 'songs' && currentArtistIndex !== null) {
                            const artist = artists[currentArtistIndex];
                            if (artist.songs && artist.songs.length > 0) {
                                const nextIdx = currentSongIndex < 0 ? 0 : (currentSongIndex + 1) % artist.songs.length;
                                playSong(currentArtistIndex, nextIdx);
                            }
                        }
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (playerMode === 'news' && currentNewsIndex !== null) {
                            playNews((currentNewsIndex - 1 + channels.length) % channels.length);
                        } else if (playerMode === 'songs' && currentArtistIndex !== null) {
                            const artist = artists[currentArtistIndex];
                            if (artist.songs && artist.songs.length > 0) {
                                const prevIdx = currentSongIndex < 0 ? 0 : (currentSongIndex - 1 + artist.songs.length) % artist.songs.length;
                                playSong(currentArtistIndex, prevIdx);
                            }
                        }
                        break;
                    case 'Escape':
                    case 'Backspace':
                        e.preventDefault();
                        if (playerMode === 'news') showHomeScreen();
                        else showArtistScreen();
                        break;
                    case 'm':
                    case 'M':
                        e.preventDefault();
                        toggleMute();
                        break;
                }
            } else if (artistVisible) {
                const totalPages = Math.ceil(artists.length / ARTISTS_PER_PAGE);
                switch(e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        if (artistPage < totalPages - 1) { artistPage++; renderArtistPage(); }
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (artistPage > 0) { artistPage--; renderArtistPage(); }
                        break;
                    case 'Escape':
                    case 'Backspace':
                        e.preventDefault();
                        showHomeScreen();
                        break;
                }
            } else {
                // Home screen - number keys for news channels
                const num = parseInt(e.key);
                if (num >= 1 && num <= channels.length) {
                    playNews(num - 1);
                }
            }
        });

        // =================================================================
        // INITIALIZE
        // =================================================================
        buildNewsGrid();
        renderArtistPage();
    </script>
</body>
</html>
